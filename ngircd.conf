[Global]
    Name = hidden.onion
    Info = Tor Hidden Service IRC
    Listen = 127.0.0.1
    Ports = 6667
    MotdFile = /etc/ngircd/motd
    ServerUID = irc
    ServerGID = irc
    
[Limits]
    MaxNickLength = 20
    MaxListSize = 100
    PingTimeout = 120
    PongTimeout = 20

[Options]
    OperCanUseMode = yes
    OperServerMode = yes
    DNS = no
    PAM = no

